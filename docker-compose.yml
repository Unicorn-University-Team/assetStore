# Whole stack on one machine: PostgreSQL, the backend, and Caddy serving the frontend in front of it.
# Server: docker compose up -d --build
# Local Postgres only: docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assetstore
      POSTGRES_USER: assetstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetstore -d assetstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://assetstore:${POSTGRES_PASSWORD}@db:5432/assetstore
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Caddy with the built frontend inside (frontend/Dockerfile): serves the site, /api goes to the backend.
  caddy:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      SITE_AUTH: ${SITE_AUTH:-off}
      SITE_AUTH_USER: ${SITE_AUTH_USER:-}
      SITE_AUTH_HASH: ${SITE_AUTH_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-auth:/etc/caddy/auth:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  db-data:
  caddy-data:
  caddy-config:
