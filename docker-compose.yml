# Whole stack on one machine: PostgreSQL (a database per service), three backend services,
# and Caddy serving the frontend and routing /api to the services (deploy/Caddyfile).
# Server: docker compose up -d --build
# Local databases only: docker compose up -d db-init
# Container logs: at most 3 files of 10 MB per service, so logs can never fill the server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Common settings of the backend services. Each one runs on port 3000 inside its container;
# only Caddy is reachable from outside.
x-service: &service
  restart: unless-stopped
  logging: *logging
  depends_on:
    db-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
    interval: 10s
    timeout: 3s
    retries: 5

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: assetstore
      POSTGRES_USER: assetstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetstore -d assetstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the databases identity, catalog and community if they are missing, then exits.
  db-init:
    image: postgres:17-alpine
    restart: "no"
    logging: *logging
    environment:
      PGHOST: db
      PGUSER: assetstore
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: assetstore
    volumes:
      - ./deploy/postgres/create-databases.sql:/create-databases.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/create-databases.sql"]
    depends_on:
      db:
        condition: service_healthy

  identity:
    <<: *service
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: identity
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://assetstore:${POSTGRES_PASSWORD}@db:5432/identity

  catalog:
    <<: *service
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: catalog
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://assetstore:${POSTGRES_PASSWORD}@db:5432/catalog
      # On the server the AWS SDK uses the EC2 instance role, no keys needed.
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_STORAGE_GB: ${MAX_STORAGE_GB:-5}
      WRITE_KEY: ${WRITE_KEY:-}

  community:
    <<: *service
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: community
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://assetstore:${POSTGRES_PASSWORD}@db:5432/community

  # Caddy with the built frontend inside (frontend/Dockerfile): serves the site, routes /api to the services.
  caddy:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      SITE_AUTH: ${SITE_AUTH:-off}
      SITE_AUTH_USER: ${SITE_AUTH_USER:-}
      SITE_AUTH_HASH: ${SITE_AUTH_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-auth:/etc/caddy/auth:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - identity
      - catalog
      - community

volumes:
  db-data:
  caddy-data:
  caddy-config:
